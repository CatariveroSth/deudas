<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuentas a Cobrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  /* ============================================================
     CONFIGURACIÓN — EDITÁ SOLO ESTA SECCIÓN
     ============================================================ */
</style>
<script>
  /* ------------------------------------------------------------
     1) "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXbQQ1ruT8o29mmjjYTsEQ8RRABHSB8A8hqj0LtBuJzR-xM6dT9_s9NuupFRT8bg/pub?gid=1120894021&single=true&output=csv"
     ------------------------------------------------------------ */
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXbQQ1ruT8o29mmjjYTsEQ8RRABHSB8A8hqj0LtBuJzR-xM6dT9_s9NuupFRT8bg/pub?gid=1120894021&single=true&output=csv";

  /* ------------------------------------------------------------
     1b) "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXbQQ1ruT8o29mmjjYTsEQ8RRABHSB8A8hqj0LtBuJzR-xM6dT9_s9NuupFRT8bg/pub?gid=1159783108&single=true&output=csv"
     ------------------------------------------------------------ */
  const CSV_URL_FACTURAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXbQQ1ruT8o29mmjjYTsEQ8RRABHSB8A8hqj0LtBuJzR-xM6dT9_s9NuupFRT8bg/pub?gid=1159783108&single=true&output=csv";

  /* ------------------------------------------------------------
     2) Usuarios permitidos. Agregá los que necesites.
        "vistas" controla a qué pestañas puede entrar cada uno:
          - ["ventas","facturas"] → ve las dos pestañas
          - ["ventas"]            → ve solo Ventas
          - ["facturas"]          → ve solo Facturas pendientes
        Si no ponés "vistas", esa persona ve las dos por defecto.
        OJO: esto NO es seguridad real, ver aviso en el chat.
     ------------------------------------------------------------ */
  const USUARIOS = [
    { user: "ventas", pass: "Sthal2026", vistas: ["ventas", "facturas"] },
    { user: "gerencia", pass: "Sthal2026", vistas: ["ventas", "facturas"] },
    { user: "fede", pass: "Facturas", vistas: ["facturas"] },
    { user: "maria", pass: "Facturas", vistas: ["facturas"] }
  ];
</script>
<style>
  :root{
    --paper: #E7EDE2;
    --paper-line: #C3D0BA;
    --ink: #1F2E23;
    --ink-soft: #4B5C4F;
    --brass: #A9803F;
    --brass-dark: #7C5E2F;
    --red: #A63D33;
    --green-ok: #3E6B4F;
    --card: #F1F5EC;
    --shadow: rgba(31,46,35,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 34px,
        var(--paper-line) 34px,
        var(--paper-line) 35px
      ),
      var(--paper);
    font-family:"IBM Plex Sans", sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 24px;
  }
  h1,h2,.stamp,.brand{font-family:"Special Elite", monospace;}
  .mono{font-family:"IBM Plex Mono", monospace;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    width:100%;
    max-width:380px;
    margin-top:6vh;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:36px 32px 32px;
    box-shadow:0 10px 30px var(--shadow);
    position:relative;
  }
  .stamp-badge{
    position:absolute;
    top:-18px;
    right:-14px;
    transform:rotate(8deg);
    background:transparent;
    border:2px solid var(--red);
    color:var(--red);
    font-family:"Special Elite", monospace;
    font-size:11px;
    letter-spacing:1px;
    padding:6px 10px;
    border-radius:6px;
    opacity:0.85;
  }
  .brand{
    font-size:22px;
    color:var(--ink);
    margin:0 0 4px;
  }
  .subtitle{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 28px;
  }
  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:16px 0 6px;
  }
  input[type=text], input[type=password]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--paper-line);
    background:#fff;
    border-radius:3px;
    font-family:"IBM Plex Mono", monospace;
    font-size:14px;
    color:var(--ink);
    outline:none;
  }
  input:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 3px rgba(169,128,63,0.18);
  }
  button{
    cursor:pointer;
    border:none;
    font-family:"Special Elite", monospace;
    letter-spacing:0.04em;
  }
  #btn-login{
    width:100%;
    margin-top:24px;
    padding:12px;
    background:var(--ink);
    color:var(--paper);
    border-radius:3px;
    font-size:14px;
    transition:background .15s ease;
  }
  #btn-login:hover{background:var(--green-ok);}
  #login-error{
    color:var(--red);
    font-size:12.5px;
    margin-top:12px;
    min-height:16px;
  }

  /* ---------- LEDGER / DASHBOARD ---------- */
  #ledger-screen{display:none; width:100%; max-width:1400px;}
  .ledger-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .ledger-title h1{font-size:24px; margin:0 0 4px;}
  .ledger-title .who{font-size:12.5px; color:var(--ink-soft);}
  .actions{display:flex; gap:10px; align-items:center;}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    padding:8px 14px;
    border-radius:3px;
    font-size:12px;
  }
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}

  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .tab-btn{
    background:transparent;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    padding:9px 16px;
    border-radius:20px;
    font-size:12.5px;
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:600;
  }
  .tab-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .tab-btn:not(.active):hover{border-color:var(--brass); color:var(--ink);}

  .filters{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:flex-end;
    margin-bottom:20px;
    padding:14px 16px;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:4px;
  }
  .filter-group{display:flex; flex-direction:column; gap:4px;}
  .filter-group label{margin:0;}
  .filter-group input, .filter-group select{
    padding:9px 10px;
    border:1px solid var(--paper-line);
    background:#fff;
    border-radius:3px;
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
    color:var(--ink);
    outline:none;
    min-width:180px;
  }
  .filter-group input:focus, .filter-group select:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 3px rgba(169,128,63,0.18);
  }
  .btn-clear{
    background:transparent;
    border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    padding:9px 12px;
    border-radius:3px;
    font-size:12px;
    height:fit-content;
  }
  .btn-clear:hover{border-color:var(--ink); color:var(--ink);}

  .totals{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .total-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:14px 20px;
    min-width:160px;
    position:relative;
  }
  .total-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);}
  .total-card .value{font-size:22px; margin-top:4px;}
  .total-card.balance .value{color:var(--red);}

  .table-wrap{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:4px;
    overflow-x:auto;
    box-shadow:0 6px 18px var(--shadow);
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink);
    border-bottom:2px solid var(--ink);
    padding:12px 16px;
    white-space:nowrap;
  }
  tbody td{
    padding:11px 16px;
    border-bottom:1px solid var(--paper-line);
    color:var(--ink);
  }
  tbody tr:hover{background:rgba(169,128,63,0.08);}
  .amount{font-family:"IBM Plex Mono", monospace; text-align:right; white-space:nowrap;}
  .tag{
    display:inline-block;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    border:1px solid currentColor;
  }
  .tag.ok{color:var(--green-ok);}
  .tag.pending{color:var(--red);}
  .tag.partial{color:var(--brass-dark);}

  #state-msg{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  #state-msg.error{color:var(--red);}
  footer{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:18px;
  }

  @media (max-width:520px){
    #login-screen{padding:28px 20px;}
    .ledger-header{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>

  <!-- ============ PANTALLA DE LOGIN ============ -->
  <div id="login-screen">
    <div class="stamp-badge">ACCESO<br>RESTRINGIDO</div>
    <h1 class="brand">Cuentas a Cobrar</h1>
    <p class="subtitle">Ingresá tus credenciales para ver el detalle.</p>

    <label for="user">Usuario</label>
    <input type="text" id="user" autocomplete="username">

    <label for="pass">Contraseña</label>
    <input type="password" id="pass" autocomplete="current-password">

    <button id="btn-login">Ingresar</button>
    <div id="login-error"></div>
  </div>

  <!-- ============ PANTALLA PRINCIPAL ============ -->
  <div id="ledger-screen">
    <div class="ledger-header">
      <div class="ledger-title">
        <h1>Cuentas a Cobrar</h1>
        <div class="who">Conectado como <span id="who-user" class="mono"></span></div>
      </div>
      <div class="actions">
        <button class="btn-ghost" id="btn-refresh">Actualizar</button>
        <button class="btn-ghost" id="btn-logout">Salir</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-ventas">Ventas</button>
      <button class="tab-btn" id="tab-btn-facturas">Facturas pendientes de pago</button>
    </div>

    <!-- ============ VISTA: VENTAS ============ -->
    <div id="view-ventas">
      <div class="filters">
        <div class="filter-group">
          <label for="filter-cliente">Cliente</label>
          <input type="text" id="filter-cliente" placeholder="Buscar por cliente…" list="lista-clientes">
          <datalist id="lista-clientes"></datalist>
        </div>
        <div class="filter-group">
          <label for="filter-entregado">Entrega</label>
          <select id="filter-entregado">
            <option value="todos">Todos</option>
            <option value="entregado">Entregados</option>
            <option value="no-entregado">No entregados</option>
          </select>
        </div>
        <button class="btn-clear" id="btn-clear-filters">Limpiar filtros</button>
      </div>

      <div class="totals" id="totals"></div>

      <div class="table-wrap">
        <div id="state-msg">Cargando datos…</div>
        <table id="data-table" style="display:none;">
          <thead><tr id="thead-row"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ============ VISTA: FACTURAS PENDIENTES DE PAGO ============ -->
    <div id="view-facturas" style="display:none;">
      <div class="filters">
        <div class="filter-group">
          <label for="filter-cliente-fact">Cliente</label>
          <input type="text" id="filter-cliente-fact" placeholder="Buscar por cliente…" list="lista-clientes-fact">
          <datalist id="lista-clientes-fact"></datalist>
        </div>
        <div class="filter-group">
          <label for="filter-responsable">Responsable</label>
          <select id="filter-responsable">
            <option value="todos">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-nota">Estado</label>
          <select id="filter-nota">
            <option value="todos">Todos</option>
            <option value="completa">Debe factura completa</option>
            <option value="saldo">Debe un saldo</option>
          </select>
        </div>
        <button class="btn-clear" id="btn-clear-filters-fact">Limpiar filtros</button>
      </div>

      <div class="totals" id="totals-fact"></div>

      <div class="table-wrap">
        <div id="state-msg-fact">Cargando datos…</div>
        <table id="data-table-fact" style="display:none;">
          <thead>
            <tr>
              <th>Fecha Factura</th>
              <th>Cliente</th>
              <th>N° Factura</th>
              <th>Monto</th>
              <th>Estado</th>
              <th>Responsable</th>
            </tr>
          </thead>
          <tbody id="tbody-fact"></tbody>
        </table>
      </div>
    </div>

    <footer>Última actualización: <span id="last-update" class="mono">—</span></footer>
  </div>

<script>
  const loginScreen = document.getElementById('login-screen');
  const ledgerScreen = document.getElementById('ledger-screen');
  const loginError = document.getElementById('login-error');

  // Login persiste solo durante la pestaña abierta (sessionStorage)
  function checkSession(){
    const saved = sessionStorage.getItem('deudas_user');
    const vistasSaved = sessionStorage.getItem('deudas_vistas');
    if(saved){
      const vistas = vistasSaved ? JSON.parse(vistasSaved) : ['ventas', 'facturas'];
      showLedger(saved, vistas);
    }
  }

  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

  function doLogin(){
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value;
    const match = USUARIOS.find(x => x.user === u && x.pass === p);
    if(match){
      const vistas = match.vistas || ['ventas', 'facturas'];
      sessionStorage.setItem('deudas_user', u);
      sessionStorage.setItem('deudas_vistas', JSON.stringify(vistas));
      loginError.textContent = '';
      showLedger(u, vistas);
    } else {
      loginError.textContent = 'Usuario o contraseña incorrectos.';
    }
  }

  document.getElementById('btn-logout').addEventListener('click', ()=>{
    sessionStorage.removeItem('deudas_user');
    sessionStorage.removeItem('deudas_vistas');
    ledgerScreen.style.display = 'none';
    loginScreen.style.display = 'block';
    document.getElementById('user').value='';
    document.getElementById('pass').value='';
  });

  document.getElementById('btn-refresh').addEventListener('click', () => {
    const vistas = JSON.parse(sessionStorage.getItem('deudas_vistas') || '["ventas","facturas"]');
    if(vistas.includes('ventas')) loadData();
    if(vistas.includes('facturas') && facturasLoaded) loadFacturas();
  });
  document.getElementById('filter-cliente').addEventListener('input', applyFilters);
  document.getElementById('filter-entregado').addEventListener('change', applyFilters);
  document.getElementById('btn-clear-filters').addEventListener('click', () => {
    document.getElementById('filter-cliente').value = '';
    document.getElementById('filter-entregado').value = 'todos';
    applyFilters();
  });

  // ---- Pestañas Ventas / Facturas ----
  const tabBtnVentas = document.getElementById('tab-btn-ventas');
  const tabBtnFacturas = document.getElementById('tab-btn-facturas');
  const viewVentas = document.getElementById('view-ventas');
  const viewFacturas = document.getElementById('view-facturas');
  let facturasLoaded = false;

  tabBtnVentas.addEventListener('click', () => {
    tabBtnVentas.classList.add('active');
    tabBtnFacturas.classList.remove('active');
    viewVentas.style.display = 'block';
    viewFacturas.style.display = 'none';
  });

  tabBtnFacturas.addEventListener('click', () => {
    tabBtnFacturas.classList.add('active');
    tabBtnVentas.classList.remove('active');
    viewVentas.style.display = 'none';
    viewFacturas.style.display = 'block';
    if(!facturasLoaded){ loadFacturas(); }
  });

  document.getElementById('filter-cliente-fact').addEventListener('input', applyFiltersFacturas);
  document.getElementById('filter-responsable').addEventListener('change', applyFiltersFacturas);
  document.getElementById('filter-nota').addEventListener('change', applyFiltersFacturas);
  document.getElementById('btn-clear-filters-fact').addEventListener('click', () => {
    document.getElementById('filter-cliente-fact').value = '';
    document.getElementById('filter-responsable').value = 'todos';
    document.getElementById('filter-nota').value = 'todos';
    applyFiltersFacturas();
  });

  // Estado en memoria: todas las filas ya parseadas (sin las "Completo"), headers y columnas detectadas
  let ALL_ROWS = [];
  let HEADERS = [];
  let COLS = {};

  function showLedger(username, vistas){
    loginScreen.style.display = 'none';
    ledgerScreen.style.display = 'block';
    document.getElementById('who-user').textContent = username;

    const puedeVentas = vistas.includes('ventas');
    const puedeFacturas = vistas.includes('facturas');

    tabBtnVentas.style.display = puedeVentas ? '' : 'none';
    tabBtnFacturas.style.display = puedeFacturas ? '' : 'none';
    // Si solo tiene acceso a una vista, ni siquiera mostramos la barra de pestañas
    document.querySelector('.tabs').style.display = (puedeVentas && puedeFacturas) ? 'flex' : 'none';

    tabBtnVentas.classList.remove('active');
    tabBtnFacturas.classList.remove('active');

    if(puedeVentas){
      tabBtnVentas.classList.add('active');
      viewVentas.style.display = 'block';
      viewFacturas.style.display = 'none';
      loadData();
    } else if(puedeFacturas){
      tabBtnFacturas.classList.add('active');
      viewFacturas.style.display = 'block';
      viewVentas.style.display = 'none';
      loadFacturas();
    }
  }

  function loadData(){
    const stateMsg = document.getElementById('state-msg');
    const table = document.getElementById('data-table');
    table.style.display = 'none';
    stateMsg.style.display = 'block';
    stateMsg.className = '';
    stateMsg.textContent = 'Cargando datos…';

    if(!CSV_URL || CSV_URL.indexOf('PEGA_AQUI') !== -1){
      stateMsg.className = 'error';
      stateMsg.textContent = 'Falta configurar CSV_URL con el link de tu Google Sheet publicado.';
      return;
    }

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results){
        prepareData(results.data, results.meta.fields || []);
      },
      error: function(err){
        stateMsg.className = 'error';
        stateMsg.textContent = 'No se pudo cargar el Google Sheet. Verificá que esté publicado como CSV y que la URL sea correcta.';
        console.error(err);
      }
    });
  }

  // Formato argentino: punto = separador de miles, coma = decimal. "-" o vacío = 0.
  function parseAmount(raw){
    if(raw === undefined || raw === null) return 0;
    const s = String(raw).trim();
    if(s === '' || s === '-') return 0;
    const cleaned = s.replace(/[^0-9,.\-]/g,'').replace(/\./g,'').replace(',', '.');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }

  function formatCurrency(n, currency){
    return n.toLocaleString('es-AR', {style:'currency', currency: currency || 'USD'});
  }

  function prepareData(rows, headers){
    const stateMsg = document.getElementById('state-msg');

    if(!rows.length || !headers.length){
      stateMsg.className = 'error';
      stateMsg.textContent = 'El Google Sheet está vacío o no tiene encabezados en la primera fila.';
      return;
    }

    HEADERS = headers;
    COLS = {
      cliente: headers.find(h => /cliente/i.test(h)),
      estado: headers.find(h => /estado/i.test(h)),
      entregado: headers.find(h => /entregado/i.test(h)),
      saldo: headers.find(h => /saldo/i.test(h)) || headers.find(h => /monto/i.test(h)),
    };
    // Columnas en dólares: las que dicen "USD" en el nombre, más el Saldo pendiente (se maneja en USD)
    COLS.moneyUSD = headers.filter(h => /usd/i.test(h) || /saldo/i.test(h));
    // Columnas en pesos argentinos: Monto total / Monto pagado (sin "USD" en el nombre), Presupuesto sin USD, etc.
    COLS.moneyARS = headers.filter(h =>
      /monto|presupuesto/i.test(h) && !COLS.moneyUSD.includes(h) && !/fecha|final/i.test(h)
    );

    // Nunca mostramos las filas ya saldadas ("Completo") — solo deudas reales
    ALL_ROWS = rows.filter(r => {
      const estado = String(r[COLS.estado] || '').trim().toLowerCase();
      return estado !== 'completo';
    });

    // Cargar el datalist de clientes para autocompletar el filtro
    if(COLS.cliente){
      const clientes = [...new Set(ALL_ROWS.map(r => r[COLS.cliente]).filter(Boolean))].sort();
      document.getElementById('lista-clientes').innerHTML =
        clientes.map(c => `<option value="${escapeHtml(c)}"></option>`).join('');
    }

    applyFilters();
    document.getElementById('last-update').textContent = new Date().toLocaleString('es-AR');
  }

  function applyFilters(){
    const clienteQ = document.getElementById('filter-cliente').value.trim().toLowerCase();
    const entregaQ = document.getElementById('filter-entregado').value;

    const filtered = ALL_ROWS.filter(r => {
      if(clienteQ && COLS.cliente){
        const c = String(r[COLS.cliente] || '').toLowerCase();
        if(!c.includes(clienteQ)) return false;
      }
      if(entregaQ !== 'todos' && COLS.entregado){
        const entregado = String(r[COLS.entregado] || '').trim() !== '';
        if(entregaQ === 'entregado' && !entregado) return false;
        if(entregaQ === 'no-entregado' && entregado) return false;
      }
      return true;
    });

    renderTable(filtered);
  }

  function renderTable(rows){
    const table = document.getElementById('data-table');
    const theadRow = document.getElementById('thead-row');
    const tbody = document.getElementById('tbody');
    const totalsEl = document.getElementById('totals');
    const stateMsg = document.getElementById('state-msg');

    // Encabezados
    theadRow.innerHTML = HEADERS.map(h => `<th>${escapeHtml(h)}</th>`).join('');

    // Filas
    tbody.innerHTML = rows.map(row => {
      return '<tr>' + HEADERS.map(h => {
        const val = row[h] ?? '';
        if(COLS.moneyUSD.includes(h)){
          const n = parseAmount(val);
          return `<td class="amount">${formatCurrency(n, 'USD')}</td>`;
        }
        if(COLS.moneyARS.includes(h)){
          const n = parseAmount(val);
          return `<td class="amount">${formatCurrency(n, 'ARS')}</td>`;
        }
        if(h === COLS.estado){
          const v = String(val).toLowerCase();
          let cls = 'pending';
          if(/anticipo/.test(v)) cls = 'partial';
          return `<td><span class="tag ${cls}">${escapeHtml(val)}</span></td>`;
        }
        return `<td>${escapeHtml(val)}</td>`;
      }).join('') + '</tr>';
    }).join('');

    // ---- Insights (se recalculan según los filtros aplicados) ----
    totalsEl.innerHTML = '';
    totalsEl.appendChild(makeTotalCard('Registros', rows.length, false));

    if(COLS.saldo){
      const sumSaldo = list => list.reduce((sum, r) => sum + parseAmount(r[COLS.saldo]), 0);

      const totalPendiente = sumSaldo(rows);
      totalsEl.appendChild(makeTotalCard('Deuda total pendiente', formatCurrency(totalPendiente), true));

      if(COLS.entregado){
        const entregadas = rows.filter(r => String(r[COLS.entregado] || '').trim() !== '');
        const noEntregadas = rows.filter(r => String(r[COLS.entregado] || '').trim() === '');

        const pendienteEntregado = sumSaldo(entregadas);
        totalsEl.appendChild(makeTotalCard('Por cobrar (ya entregado)', formatCurrency(pendienteEntregado), true));

        const cobranzaFutura = sumSaldo(noEntregadas);
        totalsEl.appendChild(makeTotalCard('Cobranza a futuro (sin entregar)', formatCurrency(cobranzaFutura), false));
      }
    }

    if(!rows.length){
      stateMsg.className = '';
      stateMsg.style.display = 'block';
      stateMsg.textContent = 'No hay deudas que coincidan con este filtro.';
      table.style.display = 'none';
      return;
    }

    stateMsg.style.display = 'none';
    table.style.display = 'table';
  }

  function makeTotalCard(label, value, isBalance){
    const div = document.createElement('div');
    div.className = 'total-card' + (isBalance ? ' balance' : '');
    div.innerHTML = `<div class="label">${escapeHtml(label)}</div><div class="value mono">${value}</div>`;
    return div;
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // ================== VISTA: FACTURAS PENDIENTES DE PAGO ==================
  let ALL_ROWS_FACT = [];
  let COLS_FACT = {};

  function loadFacturas(){
    const stateMsg = document.getElementById('state-msg-fact');
    const table = document.getElementById('data-table-fact');
    table.style.display = 'none';
    stateMsg.style.display = 'block';
    stateMsg.className = '';
    stateMsg.textContent = 'Cargando datos…';

    if(!CSV_URL_FACTURAS || CSV_URL_FACTURAS.indexOf('PEGA_AQUI') !== -1){
      stateMsg.className = 'error';
      stateMsg.textContent = 'Falta configurar CSV_URL_FACTURAS con el link de la pestaña de facturas publicada.';
      return;
    }

    Papa.parse(CSV_URL_FACTURAS, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results){
        prepareFacturas(results.data, results.meta.fields || []);
      },
      error: function(err){
        stateMsg.className = 'error';
        stateMsg.textContent = 'No se pudo cargar la hoja de facturas. Verificá que esté publicada como CSV y que la URL sea correcta.';
        console.error(err);
      }
    });
  }

  function prepareFacturas(rows, headers){
    const stateMsg = document.getElementById('state-msg-fact');
    if(!rows.length || !headers.length){
      stateMsg.className = 'error';
      stateMsg.textContent = 'La hoja de facturas está vacía o no tiene encabezados en la primera fila.';
      return;
    }

    const fechaCol = headers.find(h => /fecha/i.test(h));
    const clienteCol = headers.find(h => /cliente/i.test(h));
    const facturaCol = headers.find(h => /factura/i.test(h) && h !== fechaCol);
    const montoCol = headers.find(h => /monto/i.test(h));
    const notaCol = headers.find(h => /nota/i.test(h));
    // Cualquier columna que no sea ninguna de las anteriores se toma como "responsable" (Mari, Fede, Ventas, etc.)
    const responsableCols = headers.filter(h => ![fechaCol, clienteCol, facturaCol, montoCol, notaCol].includes(h));

    COLS_FACT = { fechaCol, clienteCol, facturaCol, montoCol, notaCol, responsableCols };

    ALL_ROWS_FACT = rows.filter(r => (clienteCol ? String(r[clienteCol] || '').trim() !== '' : true));

    // Datalist de clientes
    if(clienteCol){
      const clientes = [...new Set(ALL_ROWS_FACT.map(r => r[clienteCol]).filter(Boolean))].sort();
      document.getElementById('lista-clientes-fact').innerHTML =
        clientes.map(c => `<option value="${escapeHtml(c)}"></option>`).join('');
    }

    // Poblar el filtro de Responsable dinámicamente
    const selResp = document.getElementById('filter-responsable');
    selResp.innerHTML = '<option value="todos">Todos</option>' +
      responsableCols.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');

    facturasLoaded = true;
    applyFiltersFacturas();
    document.getElementById('last-update').textContent = new Date().toLocaleString('es-AR');
  }

  function getResponsable(row){
    const p = COLS_FACT.responsableCols.find(col => String(row[col] || '').trim() !== '');
    return p || '—';
  }

  function applyFiltersFacturas(){
    const clienteQ = document.getElementById('filter-cliente-fact').value.trim().toLowerCase();
    const respQ = document.getElementById('filter-responsable').value;
    const notaQ = document.getElementById('filter-nota').value;

    const filtered = ALL_ROWS_FACT.filter(r => {
      if(clienteQ && COLS_FACT.clienteCol){
        const c = String(r[COLS_FACT.clienteCol] || '').toLowerCase();
        if(!c.includes(clienteQ)) return false;
      }
      if(respQ !== 'todos' && getResponsable(r) !== respQ) return false;
      if(notaQ !== 'todos'){
        const tieneNota = COLS_FACT.notaCol ? String(r[COLS_FACT.notaCol] || '').trim() !== '' : false;
        if(notaQ === 'completa' && tieneNota) return false;
        if(notaQ === 'saldo' && !tieneNota) return false;
      }
      return true;
    });

    renderFacturas(filtered);
  }

  function renderFacturas(rows){
    const table = document.getElementById('data-table-fact');
    const tbody = document.getElementById('tbody-fact');
    const totalsEl = document.getElementById('totals-fact');
    const stateMsg = document.getElementById('state-msg-fact');

    tbody.innerHTML = rows.map(r => {
      const nota = COLS_FACT.notaCol ? String(r[COLS_FACT.notaCol] || '').trim() : '';
      const estadoTag = nota
        ? `<span class="tag partial">${escapeHtml(nota)}</span>`
        : `<span class="tag pending">Debe completa</span>`;
      const monto = parseAmount(r[COLS_FACT.montoCol]);
      return `<tr>
        <td>${escapeHtml(r[COLS_FACT.fechaCol] || '')}</td>
        <td>${escapeHtml(r[COLS_FACT.clienteCol] || '')}</td>
        <td>${escapeHtml(r[COLS_FACT.facturaCol] || '')}</td>
        <td class="amount">${formatCurrency(monto, 'ARS')}</td>
        <td>${estadoTag}</td>
        <td>${escapeHtml(getResponsable(r))}</td>
      </tr>`;
    }).join('');

    // ---- Insights ----
    totalsEl.innerHTML = '';
    totalsEl.appendChild(makeTotalCard('Facturas pendientes', rows.length, false));

    const totalMonto = rows.reduce((sum, r) => sum + parseAmount(r[COLS_FACT.montoCol]), 0);
    totalsEl.appendChild(makeTotalCard('Total pendiente de cobro', formatCurrency(totalMonto, 'ARS'), true));

    // Un total por cada responsable (Mari, Fede, Ventas, etc.)
    COLS_FACT.responsableCols.forEach(persona => {
      const suma = rows
        .filter(r => getResponsable(r) === persona)
        .reduce((sum, r) => sum + parseAmount(r[COLS_FACT.montoCol]), 0);
      totalsEl.appendChild(makeTotalCard('A cargo de ' + persona, formatCurrency(suma, 'ARS'), false));
    });

    if(!rows.length){
      stateMsg.className = '';
      stateMsg.style.display = 'block';
      stateMsg.textContent = 'No hay facturas que coincidan con este filtro.';
      table.style.display = 'none';
      return;
    }

    stateMsg.style.display = 'none';
    table.style.display = 'table';
  }

  checkSession();
</script>
